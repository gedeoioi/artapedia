name: ArtaPedia CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, sqlite3, pdo_sqlite, intl, zip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist
      - name: Setup env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Build frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Run test suite
        shell: bash
        run: |
          set +e
          php artisan test --colors=never --stop-on-failure 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(grep -E 'FAIL|FAILED|Error|Exception|Failed asserting|Expected|Actual|Tests:' test-output.log | tail -n 60 | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Laravel test failure::$message"
          fi
          exit "$status"
